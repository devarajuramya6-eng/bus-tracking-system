<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buses Directory & Telemetry — CityBus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-bus"></i></div>
        <div class="logo-text">City<span>Bus</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="passenger-map.html"><i class="fa-solid fa-map-location-dot"></i> Live Map</a></li>
        <li><a href="journey-planner.html"><i class="fa-solid fa-route"></i> Plan Trip</a></li>
        <li><a href="buses.html" class="active"><i class="fa-solid fa-bus-simple"></i> Buses</a></li>
        <li><a href="routes.html"><i class="fa-solid fa-signs-post"></i> Routes</a></li>
        <li><a href="tickets.html"><i class="fa-solid fa-ticket"></i> Book Pass</a></li>
      </ul>
      <div class="nav-actions">
        <button class="icon-btn" id="cmd-palette-btn"><i class="fa-solid fa-terminal"></i></button>
        <button class="theme-toggle" id="theme-toggle-btn"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem;">
    <!-- Title & Controls -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--cb-text-primary); margin-bottom: 0.25rem;">
          Operating Bus Fleet
        </h1>
        <p style="color: var(--cb-text-secondary); font-size: 0.95rem;" id="buses-total-count">
          Loading active fleet...
        </p>
      </div>

      <!-- Search & Filters -->
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <div style="position: relative; width: 260px;">
          <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--cb-text-muted);"></i>
          <input type="text" id="bus-search-input" class="form-control form-control-sm" placeholder="Filter buses..." style="padding-left: 2.2rem;">
        </div>

        <div style="display: flex; gap: 0.4rem;">
          <button class="filter-chip active" data-filter="All">All</button>
          <button class="filter-chip" data-filter="On Route">Moving</button>
          <button class="filter-chip" data-filter="Delayed">Delayed</button>
          <button class="filter-chip" data-filter="Favorites">★ Favs</button>
        </div>
      </div>
    </div>

    <!-- Mini Map Split View -->
    <div class="card" style="padding: 0.5rem; margin-bottom: 2rem; height: 260px;">
      <div id="buses-catalog-map" style="width: 100%; height: 100%; border-radius: var(--cb-radius-md);"></div>
    </div>

    <!-- Buses Grid -->
    <div class="buses-grid" id="buses-catalog-grid">
      <!-- Injected by js/passenger/buses_catalog.js -->
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/command_palette.js"></script>
  <script src="js/map/map_engine.js"></script>
  <script src="js/map/interpolator.js"></script>
  <script src="js/map/bus_layer.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/passenger/buses_catalog.js"></script>
</body>
</html>
