<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Management & Kanban — CityBus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--cb-bg-subtle);">

  <header class="header">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon" style="background: var(--cb-status-danger);"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="logo-text">Incident<span>Control</span></div>
      </div>
      <div class="nav-actions">
        <a href="admin.html" class="btn btn-outline btn-xs"><i class="fa-solid fa-arrow-left"></i> Admin Portal</a>
        <a href="dispatcher.html" class="btn btn-primary btn-xs"><i class="fa-solid fa-tower-broadcast"></i> Dispatcher Radar</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1440px; margin: 1.5rem auto; padding: 0 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--cb-text-primary);">
          Transit Incident Kanban Workflow
        </h1>
        <p style="color: var(--cb-text-secondary); font-size: 0.9rem;">
          Drag and drop incident cards to update status and dispatch field response units.
        </p>
      </div>
    </div>

    <!-- 4-Column Kanban Grid -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem;">
      
      <!-- New Column -->
      <div class="card kanban-column" style="padding: 1rem; background: var(--cb-bg-surface);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--cb-status-info);">
          <strong style="color: var(--cb-text-primary); font-size: 0.95rem;">NEW / REPORTED</strong>
          <span class="badge badge-info" id="count-new">0</span>
        </div>
        <div class="kanban-column-body" id="kanban-col-new" data-status="New" style="min-height: 450px;"></div>
      </div>

      <!-- Acknowledged Column -->
      <div class="card kanban-column" style="padding: 1rem; background: var(--cb-bg-surface);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--cb-brand-primary);">
          <strong style="color: var(--cb-text-primary); font-size: 0.95rem;">ACKNOWLEDGED</strong>
          <span class="badge badge-primary" id="count-acknowledged">0</span>
        </div>
        <div class="kanban-column-body" id="kanban-col-acknowledged" data-status="Acknowledged" style="min-height: 450px;"></div>
      </div>

      <!-- In Progress Column -->
      <div class="card kanban-column" style="padding: 1rem; background: var(--cb-bg-surface);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--cb-status-warning);">
          <strong style="color: var(--cb-text-primary); font-size: 0.95rem;">IN PROGRESS</strong>
          <span class="badge badge-warning" id="count-in-progress">0</span>
        </div>
        <div class="kanban-column-body" id="kanban-col-in-progress" data-status="In Progress" style="min-height: 450px;"></div>
      </div>

      <!-- Resolved Column -->
      <div class="card kanban-column" style="padding: 1rem; background: var(--cb-bg-surface);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--cb-status-success);">
          <strong style="color: var(--cb-text-primary); font-size: 0.95rem;">RESOLVED</strong>
          <span class="badge badge-success" id="count-resolved">0</span>
        </div>
        <div class="kanban-column-body" id="kanban-col-resolved" data-status="Resolved" style="min-height: 450px;"></div>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/admin/incident_center.js"></script>
</body>
</html>
