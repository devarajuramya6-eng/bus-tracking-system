<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CityBus Enterprise Transit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top, var(--cb-brand-primary-light), var(--cb-bg-subtle) 70%); padding: 1.5rem;">

  <div style="width: 100%; max-width: 440px;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 0.5rem; text-decoration: none;">
        <div class="logo-icon"><i class="fa-solid fa-bus"></i></div>
        <div class="logo-text" style="font-size: 1.5rem;">City<span>Bus</span></div>
      </a>
      <p style="color: var(--cb-text-secondary); font-size: 0.9rem;">Sign in to access your transit account</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="padding: 2rem; box-shadow: var(--cb-shadow-xl);">
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="login-email" value="passenger@citybus.transit" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.75rem; color: var(--cb-brand-primary); text-decoration: none;">Forgot?</a>
          </div>
          <input type="password" class="form-control" id="login-password" value="citybus2026" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;" id="login-submit-btn">
          Sign In
        </button>
      </form>

      <!-- 1-Click Demo Role Switches -->
      <div style="margin-top: 1.5rem; border-top: 1px solid var(--cb-border-subtle); padding-top: 1.25rem;">
        <div style="font-size: 0.75rem; font-weight: 700; color: var(--cb-text-muted); text-transform: uppercase; margin-bottom: 0.75rem; text-align: center;">
          1-Click Sandbox Credentials (All Roles)
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;">
          <button class="btn btn-outline btn-xs demo-role-btn" data-email="passenger@citybus.transit" data-role="passenger">Passenger</button>
          <button class="btn btn-outline btn-xs demo-role-btn" data-email="ravi@citybus.transit" data-role="driver">Driver (Ravi)</button>
          <button class="btn btn-outline btn-xs demo-role-btn" data-email="conductor@citybus.transit" data-role="conductor">Conductor</button>
          <button class="btn btn-outline btn-xs demo-role-btn" data-email="dispatcher@citybus.transit" data-role="dispatcher">Dispatcher</button>
          <button class="btn btn-outline btn-xs demo-role-btn" data-email="admin@citybus.transit" data-role="admin">Admin</button>
          <button class="btn btn-outline btn-xs demo-role-btn" data-email="superadmin@citybus.transit" data-role="super_admin">Super Admin</button>
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--cb-text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--cb-brand-primary); font-weight: 600; text-decoration: none;">Create an account</a>
    </div>
  </div>

  <script src="js/core/theme.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/components/toast.js"></script>
  <script>
    document.querySelectorAll('.demo-role-btn').forEach(btn => {
      btn.onclick = () => {
        const email = btn.dataset.email;
        const role = btn.dataset.role;
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').value = 'citybus2026';
        if (window.CityBusAuth) window.CityBusAuth.switchRole(role);
      };
    });

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;

      try {
        if (window.CityBusAPI) {
          const res = await window.CityBusAPI.login(email, pass);
          if (res && res.success) {
            window.location.href = 'index.html';
            return;
          }
        }
      } catch {}

      // Fallback
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
