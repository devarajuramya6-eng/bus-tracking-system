<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit Analytics & OTP — CityBus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--cb-bg-subtle);">

  <header class="header">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon"><i class="fa-solid fa-chart-pie"></i></div>
        <div class="logo-text">Transit<span>Analytics</span></div>
      </div>
      <div class="nav-actions">
        <a href="admin.html" class="btn btn-outline btn-xs"><i class="fa-solid fa-arrow-left"></i> Admin Portal</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 1.5rem auto; padding: 0 1.5rem;">
    <div style="margin-bottom: 1.5rem;">
      <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--cb-text-primary);">
        Transit Performance Analytics
      </h1>
      <p style="color: var(--cb-text-secondary); font-size: 0.9rem;">
        Ridership trends, on-time performance (OTP), and fleet utilization metrics.
      </p>
    </div>

    <!-- 2-Column Chart Grid -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div class="card" style="padding: 1.5rem;">
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--cb-text-primary); margin-bottom: 1rem;">
          Weekly Ridership (Passengers)
        </h3>
        <canvas id="analytics-ridership-chart" style="width: 100%; height: 260px;"></canvas>
      </div>

      <div class="card" style="padding: 1.5rem;">
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--cb-text-primary); margin-bottom: 1rem;">
          On-Time Performance (OTP %)
        </h3>
        <canvas id="analytics-otp-chart" style="width: 100%; height: 260px;"></canvas>
      </div>
    </div>

    <!-- Fleet Donut Chart -->
    <div class="card" style="padding: 1.5rem; max-width: 500px; margin: 0 auto; text-align: center;">
      <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--cb-text-primary); margin-bottom: 1rem;">
        Active Fleet Availability
      </h3>
      <canvas id="analytics-fleet-donut" style="width: 260px; height: 260px; margin: 0 auto; display: block;"></canvas>
    </div>
  </main>

  <script src="js/core/theme.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/components/chart_engine.js"></script>
  <script src="js/admin/analytics_center.js"></script>
</body>
</html>
