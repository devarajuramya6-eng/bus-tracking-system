<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit Routes & Corridors — CityBus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-bus"></i></div>
        <div class="logo-text">City<span>Bus</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="passenger-map.html"><i class="fa-solid fa-map-location-dot"></i> Live Map</a></li>
        <li><a href="journey-planner.html"><i class="fa-solid fa-route"></i> Plan Trip</a></li>
        <li><a href="buses.html"><i class="fa-solid fa-bus-simple"></i> Buses</a></li>
        <li><a href="routes.html" class="active"><i class="fa-solid fa-signs-post"></i> Routes</a></li>
        <li><a href="tickets.html"><i class="fa-solid fa-ticket"></i> Book Pass</a></li>
      </ul>
      <div class="nav-actions">
        <button class="icon-btn" id="cmd-palette-btn"><i class="fa-solid fa-terminal"></i></button>
        <button class="theme-toggle" id="theme-toggle-btn"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--cb-text-primary); margin-bottom: 0.25rem;">
          Transit Corridors & Schedules
        </h1>
        <p style="color: var(--cb-text-secondary); font-size: 0.95rem;">
          20 municipal corridors across Vijayawada, Guntur, and Amaravati.
        </p>
      </div>

      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button class="route-category-filter filter-chip active" data-category="All">All Corridors</button>
        <button class="route-category-filter filter-chip" data-category="Express">Express</button>
        <button class="route-category-filter filter-chip" data-category="Metro">Metro</button>
        <button class="route-category-filter filter-chip" data-category="Airport">Airport</button>
        <button class="route-category-filter filter-chip" data-category="Local">Local</button>
      </div>
    </div>

    <!-- Routes Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem;" id="routes-catalog-grid">
      <!-- Injected by js/passenger/routes_catalog.js -->
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/components/command_palette.js"></script>
  <script src="js/passenger/routes_catalog.js"></script>
</body>
</html>
